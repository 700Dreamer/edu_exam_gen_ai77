<!DOCTYPE html>
<html>
<head>
<style>
.body-c { font-size: 15.5px; line-height: 2.2; white-space: pre-wrap; font-family: "Times New Roman", Times, serif !important; }
</style>
</head>
<body class="body-c">
<div class="q-wrap" style="margin-bottom:22px; clear:both; position:relative; line-height:1.5; white-space:normal;">
  <div style="font-size:15px; display:flex; align-items:flex-start; margin-bottom:5px;">
    <span style="font-weight:bold; margin-right:5px; flex-shrink:0;">1.</span>
    <span style="flex:1;">Question text</span>
  </div>

  <div style="display: flex; gap: 20px;">
    <!-- LEFT PANE -->
    <div style="flex: 2;">
        <div style="font-family: 'Patrick Hand', 'Comic Sans MS', cursive, sans-serif; color: #0066cc; font-size: 19px; margin: 5px 0 10px 25px; font-weight: bold; line-height: 1.4; letter-spacing: 0.5px;">
            <div style="display: flex; gap: 15px; align-items: flex-start; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 150px;">
                    <div style="margin-bottom: 8px; display: flex; align-items: center; flex-wrap: wrap; position: relative;">
                        <span style="margin-right: 10px;">Let the number of oranges be 4x.</span>
                        <span style="color: #ff0000; font-weight: bold; font-family: 'Patrick Hand', sans-serif; white-space: nowrap; transform: rotate(-5deg); display: inline-block;">✓ <sub>M1</sub></span>
                    </div>
                    <div style="margin-bottom: 8px; display: flex; align-items: center; flex-wrap: wrap; position: relative;">
                        <span style="margin-right: 10px;">Since 3x = 12, x = 4.</span>
                        <span style="color: #ff0000; font-weight: bold; font-family: 'Patrick Hand', sans-serif; white-space: nowrap; transform: rotate(-5deg); display: inline-block;">✓ <sub>M1</sub></span>
                    </div>
                    <div style="margin-bottom: 8px; display: flex; align-items: center; flex-wrap: wrap; position: relative;">
                        <span style="margin-right: 10px;">Number of oranges = 4 x 4 = 16</span>
                        <span style="color: #ff0000; font-weight: bold; font-family: 'Patrick Hand', sans-serif; white-space: nowrap; transform: rotate(-5deg); display: inline-block;">✓ <sub>M1</sub></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- RIGHT PANE -->
    <div style="flex: 1; border-left: 2px solid #0066cc; padding-left: 15px; display: flex; flex-direction: column; gap: 10px;">
        <div style="background-color: #fffacd; border: 2px solid #000; padding: 8px; font-size: 12px;">
            <div style="font-weight: 900; text-decoration: underline; margin-bottom: 4px;">Note:</div>
            <div style="font-weight: bold; color: #000;">Require correct use of ratio for solution.</div>
        </div>
    </div>
  </div>
</div>
</body>
</html>
